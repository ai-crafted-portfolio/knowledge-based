      - "JCL PROC / 制御": categories/c20/index.md
      - "JES2": categories/c21/index.md
      - "MVS オペレータコマンド": categories/c22/index.md
      - "Netcool/OMNIbus V8.1": categories/c23/index.md
      - "PSF for z/OS 4.7": categories/c24/index.md
      - "PowerHA SystemMirror 7.2": categories/c25/index.md
      - "RACF SETROPTS/RDEFINE/RACDCERT": categories/c26/index.md
      - "RACF USER/GROUP/DATASET": categories/c27/index.md
      - "SMP/E / SMF / WLM": categories/c28/index.md
      - "Sysplex / XCF / GRS / CF": categories/c29/index.md
      - "TSO / ISPF / SDSF": categories/c30/index.md
      - "Tivoli Log File Agent 6.3": categories/c31/index.md
      - "Tivoli NetView z/OS 自動化": categories/c32/index.md
      - "UNIX System Services (USS)": categories/c33/index.md
