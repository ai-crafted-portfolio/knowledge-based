site_name: z/OS 技術ナレッジベース
site_description: z/OS と関連製品の技術項目・確認問題・検証手順をカテゴリ別に検索・閲覧できるナレッジベース
site_author: Knowledge Base
site_url: https://ai-crafted-portfolio.github.io/knowledge-based/

theme:
  name: material
  language: ja
  font:
    text: Segoe UI
    code: Cascadia Code
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link

extra_css:
  - stylesheets/ms-style.css

extra:
  generator: false

plugins:
  - search:
      lang:
        - ja
        - en

not_in_nav: |
  /categories/*/part-*.md

validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: このページの内容
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.keys

nav:
  - ホーム: index.md
  - カテゴリ別 対応状況: categories/index.md
  - カテゴリ:
      - "AIX 7.3": categories/c01/index.md
      - "Anthropic Claude Support / Console Administration": categories/c02/index.md
      - "Assembler / システム・プログラミング": categories/c03/index.md
      - "CICS Transaction Server for z/OS 6.x": categories/c04/index.md
      - "Comm Server / VTAM / TCP/IP": categories/c05/index.md
      - "DFSMS / IDCAMS / VSAM": categories/c06/index.md
      - "Db2 for z/OS": categories/c07/index.md
      - "ESS REC / REC NEAO": categories/c08/index.md
      - "GDPS 災害対策・サイトスイッチ": categories/c09/index.md
      - "IBM Guardium Data Protection 12.x": categories/c10/index.md
      - "IBM IIDR 11.4": categories/c11/index.md
      - "IBM MQ メッセージング": categories/c12/index.md
      - "IBM Personal Communications 15.0": categories/c13/index.md
      - "IBM Spectrum Protect 8.1": categories/c14/index.md
      - "IBM Workload Automation": categories/c15/index.md
      - "IMS 15.5": categories/c16/index.md
      - "JCL DD 文": categories/c17/index.md
