site_name: ナレッジベース
site_description: 技術ナレッジとリファレンス
site_author: Knowledge Team
site_url: https://example.com/knowledge-base/

theme:
  name: material
  custom_dir: docs/overrides
  language: ja
  font:
    text: Segoe UI
    code: Cascadia Code
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/ms-style.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
  generator: false

plugins:
  - search:
      lang:
        - ja
        - en
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: このページの内容
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic

nav:
  - ホーム: index.md
  - カテゴリ:
      - categories/index.md
      - はじめに: categories/getting-started.md
      - 操作ガイド: categories/how-to.md
      - リファレンス: categories/reference.md
      - トラブルシューティング: categories/troubleshooting.md
  - 記事:
      - articles/index.md
  - FAQ: faq.md
  - 検索: search.md
