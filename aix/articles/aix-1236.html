<div class="official-dom"><div>
<section><h2>目的</h2> <p><span>ワークロード・パーティション</span>を自動的に開始します。</p>
</section>

<section><h2>構文</h2><code>/etc/rc.wpars</code></section>

<section><h2>説明</h2> <p>この <strong>/etc/rc.wpars</strong> コマンドは、 <strong>自動開始</strong>オプション （<strong>mkwpar/chwpar -A</strong> ）が有効になっているすべての<span>ワークロード・パーティションで</span> <strong>startwpar</strong> コマンドを呼び出します。 <strong>/etc/rc.wpars</strong> コマンドは、システムが起動されるたびに自動的に実行されます。</p>
</section>

</div></div>
