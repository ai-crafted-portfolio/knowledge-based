<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
権限のあるユーザーにのみ、システムのブートを許可します。

説明
bootauth
コマンドは、システムが権限のあるユーザーによって始動されていることを検証します。
bootauth
コマンドを使用すると、ユーザー名とパスワードの入力を要求するプロンプトが出されます。 入力したユーザー名とパスワードが無効な場合、またはユーザー名に
aix.system.boot
権限がない場合、
bootauth
コマンドは再度プロンプトを出します。 3 回試行に失敗すると、システムは再始動します。

構文
bootauth</pre>
