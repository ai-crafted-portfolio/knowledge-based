<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
デフォルトのシェルを起動します。

説明
sh
コマンドはデフォルトのシェルを起動し、その構文とフラグを使用します。
/usr/bin/sh
パスにリンクされているシェルが、デフォルトのシェルです。 オペレーティング・システムの標準構成では、
/usr/bin/sh
パスは Korn シェルにリンクされています。

構文
ksh コマンドの構文を参照してください。 /usr/bin/sh ファイルは Korn シェルにリンクされています。

オプション
フラグ
Korn シェル (
ksh
コマンド) のフラグを参照してください。</pre>
