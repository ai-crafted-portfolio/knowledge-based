<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
デバイス・クラスのデバイスを表示します。

説明
DeviceClass
パラメーターが、入出力装置構成データベースの
カスタマイズ・デバイスのオブジェクト・クラスを参照しているデバイスに関する情報をリストします。

構文
リスト DeviceClass

例
adapter
クラスのデバイスをリストするには、次のように入力します。
listdgrp adapter
出力は次のようになります。
a0
sa1
siokma0
fda0
scsi0
scsi1
bl0
sioka0
siota0</pre>
