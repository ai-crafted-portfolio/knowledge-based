<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
現在システムにログオンしているユーザーの短縮リストを表示します。

説明
users
コマンドは、現在システムにログオンしているユーザーのログイン名を、短縮された、1 行からなるリスト形式の標準出力 (
stdout
) にリストします。 ファイルの絶対パス名を指定すると、それが
/etc/utmp
に代わって代替ファイルとして使用されます。 絶対パス名を指定しない場合、それは
ワークロード・パーティション
の名前と見なされます。 名前が「グローバル」の場合は、グローバル環境を示します。

構文
ユーザー [ FileName | WparName ]</pre>
