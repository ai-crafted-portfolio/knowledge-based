<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
/usr/games
ディレクトリー内のファイルの許可コードをオフに設定します。

説明
turnoff
コマンドは、
/usr/games
ディレクトリー内のファイルの許可コードを設定します。 このコマンドを実行するには、root ユーザー権限が必要です。
turnoff
コマンドは、許可コードを 111 に設定されたファイルを
/usr/games
内で検索し、許可を 000 に設定します。
/usr/games
ディレクトリーに新しいゲームをインストールする場合は、
許可を 111 に設定します。

構文
ターノフ (turnoff)</pre>
