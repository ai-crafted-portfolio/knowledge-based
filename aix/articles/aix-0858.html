<div class="official-dom"><div>
<section><h2>目的</h2> <p>現在のホストのプロセッサー・タイプを表示します。</p>
</section>

<section><h2>構文</h2> <p><strong>mach</strong></p>
</section>

<section><h2>説明</h2> <p><strong>mach</strong> コマンドは、システム・プロセッサーのアーキテクチャーを表示します。</p>
</section>

<section><h2>終了状況</h2> <dl>
<dt>0</dt>

<dd>コマンドは正常に完了しました。</dd>


<dt>&gt;0</dt>

<dd>エラーが発生しました。</dd>

</dl>
</section>

<section><h2>例</h2> <ol>
<li>現在のホストのプロセッサー・タイプを表示するには、<strong>
mach</strong> コマンドを次のように使用します。<div><div><pre><code>mach</code></pre></div><div></div></div></li>

</ol>
</section>

<section><h2>ファイル</h2> 
<div><div><table><thead> <tr> <th><div>項目</div></th>
 <th><div>説明</div></th>
 </tr>
 </thead>
<tbody>
<tr>
<td><strong>/usr/bin/mach</strong></td>

<td>System V <strong>mach</strong> コマンドが入っています。</td>

</tr>

</tbody>
</table></div>
</div>
</section>

</div></div>
