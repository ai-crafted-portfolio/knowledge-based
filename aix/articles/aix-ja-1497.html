<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
stop-secldapclntd
スクリプトは、
secldapclntd
LDAP クライアント・デーモンを終了するために使用されます。

説明
stop-secldapclntd
スクリプトは、実行中
の
secldapclntd
デーモン・プロセスを終了し
ます。
secldapclntd
デーモンが実行されていない
場合は、エラーを戻します。

構文
/usr/sbin/stop-secldapclntd

例
実行中の
secldapclntd
デーモン・プロセスを停止するには、
次のように入力します。
/usr/sbin/stop-secldapclntd</pre>
