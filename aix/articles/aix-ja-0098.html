<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ブート用の情報をディスクレス・クライアントに提供します。

説明
bootparamd
デーモンは、ブートのためにディスクレス・クライアントが必要とする情報を提供するサーバー・プロセスです。 このデーモンは、NIS サービスが実行中でないときは
bootparams
データベースまたは
/etc/bootparams
ファイルを調べます。

構文
/usr/sbin/rpc.bootparamd [ -d ]

オプション
フラグ
項目 | 説明
-d | デバッグ情報を表示します。</pre>
