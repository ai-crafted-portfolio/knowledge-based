<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ローカル認証情報が正しいかどうかを検証します。

説明
pwck
コマンドは、すべてのユーザーの定義を検査し、
ユーザー・データベース・ファイル内のパスワード情報が正しいことを検証します。
pwck
コマンドは、
-n
オプションおよび
ALL
オプションを指定して
pwdck
コマンドを内部的に呼び出します。

構文
pwck

例
すべてのユーザーおよび管理者がユーザー・データベースに存在することを検証し、
エラーを報告させる (しかし、修正はしない) には、次のように入力します。
pwck</pre>
