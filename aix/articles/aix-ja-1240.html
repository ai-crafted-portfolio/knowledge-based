<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ファイルをリモート側で配布するサーバー・プログラム。

説明
rdistd
は、
rdist
コマンドのサーバー・プログラムです。 これは通常、
rsh
を使用して
rdist
により実行されます。
-S
フラグを使用すると、通常は通常のユーザーの PATH 環境変数に存在するため、
rdistd
が誤って開始されることがなくなります。

構文
rdistd -S rdistd -V

オプション
フラグ
項目 | 説明
-V | バージョン情報を印刷し、終了します。</pre>
