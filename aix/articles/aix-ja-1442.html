<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
カーネルおよびライブラリー・メモリー内で現在使用されていないモジュールすべてを除去します。

説明
slibclean
コマンドは、ロードおよび使用回数が 0 のすべてのオブジェクト・ファイルをアンロードします。 また、不要になったオブジェクト・ファイルを除去することによって、共用ライブラリー領域と共用ライブラリーおよびカーネル・テキスト領域の両方から使用されなくなったオブジェクト・ファイルを除去するために使用することもできます。

構文
slibclean</pre>
