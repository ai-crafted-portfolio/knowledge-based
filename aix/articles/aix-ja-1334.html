<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
システム・レジストリーから rset を除去します。

説明
rmrset
コマンドは、システム・レジストリーから rset または排他的 rset (xrset) を除去します。
rmrset
コマンドを使用して xrset を削除すると、システム上の対応する CPU の状態が汎用モードに変更されます。 xrset の削除には root 権限が必要です。

構文
rmrset rsetname

例
システム・レジストリーから
test/cpus0to7
を除去するには、次のように入力します。
rmrset test/cpus0to7</pre>
