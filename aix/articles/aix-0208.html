<section><h2>目的</h2> <p>暗号鍵を変更します。</p>
</section>

<section><h2>構文</h2> <p><strong>/usr/bin/chkey</strong></p>
</section>

<section><h2>説明</h2> <p><strong>chkey</strong> コマンドは、パスワードを求めるプロンプトを表示し、そのパスワードを使用して新しい暗号鍵を暗号化します。 鍵が暗号化されると、<strong>ypupdated</strong> デーモンは、<strong>/etc/publickey</strong> ファイルを更新します。</p>
</section>

</div></div>
