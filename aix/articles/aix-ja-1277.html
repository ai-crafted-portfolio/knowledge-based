<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ファイルの各行の文字の順序を逆にします。

説明
rev
コマンドは、各行の文字の順序を逆にして、指定されたファイルを標準出力に出力します。 ファイルを指定しなければ、
rev
コマンドは標準入力を読み取ります。

構文
rev [ ファイル ... ]

例
ファイルの各行の順序を逆にするには、以下のように入力します。
rev file
もし
file
ファイルには次のテキストが含まれます
abcdefghi
123456789
rev
コマンドは以下のように表示します。
ihgfedcba
987654321</pre>
