<div class="official-dom"><div>
<section><h2>目的</h2> <p>ユーザーのログイン名を表示します。</p>
</section>

<section><h2>構文</h2> <p><strong>whoami</strong></p>
</section>

<section><h2>説明</h2> <p><strong>whoami</strong> コマンドはログイン名を表示します。 コマンド <strong>who</strong> を使用して <strong>am i</strong> を指定するのと違い、
<strong>whoami</strong> コマンドは <strong>/etc/utmp</strong> ファイルを調べないので、root 権限がある場合にも機能します。</p>
</section>

<section><h2>ファイル</h2> <div> 
<div><div><table><thead>
<tr>
<th><div>項目</div></th>

<th><div>説明</div></th>

</tr>

</thead>
<tbody>
<tr>
<td><strong>/etc/passwd</strong></td>

<td>ユーザー ID が入っています。</td>

</tr>

</tbody>
</table></div>
</div>
</div>
</section>
