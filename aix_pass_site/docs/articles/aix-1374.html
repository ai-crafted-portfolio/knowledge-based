<section><h2>目的</h2> <p>カーネルから入手したパフォーマンス統計情報を戻します。</p>
</section>

<section><h2>構文</h2> <p><span>/usr/sbin/rpc.rstatd</span></p>
</section>

<section><h2>説明</h2> <p><strong>rstatd</strong> デーモンは、カーネルから得たパフォーマンス統計情報を戻すサーバーです。 <strong>rstatd</strong> デーモンは通常、<strong>inetd</strong> デーモンによって始動されます。</p>
</section>

<tr>

</tr>

<tr>
<td><strong>/etc/services</strong></td>
