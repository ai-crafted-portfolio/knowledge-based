<section><h2>目的</h2> <p>基本ネットワーク・ユーティリティー (BNU) を使用して受信したリモート・メールを処理します。</p>
</section>

<section><h2>構文</h2> <p><span>rmail</span> ユーザー</p>
</section>

<section><h2>説明</h2> <p><strong>rmail</strong> コマンドは <strong>uucp</strong> コマンドを使用して受信した着信メールを解釈します。 省略表示されます。From<strong>ベルメール</strong> コマンドによって生成された形式のヘッダー行は、以下の形式の単一行になります。</p>
 <div> <div><div><pre><code>return-path!sender</code></pre></div><div></div></div></div>
 <p><strong>rmail</strong> コマンドは処理済みのメールを <strong>sendmail</strong> コマンドに渡します。 <em>User</em> パラメーターは、<strong>sendmail</strong> コマンドによって認識されたユーザーを指定しなければなりません。</p>
</section>

</div></div>
