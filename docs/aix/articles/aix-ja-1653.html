<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
別名の定義を除去します。

説明
unalias
コマンドは、指定されたそれぞれの別名の定義を除去するか、
または
-a
フラグが使用された場合はすべての別名定義を除去します。 別名定義は、現在のシェル環境から除去されます。
unalias
コマンドは、現在のシェル実行環境に影響を及ぼすため、
Korn シェル (POSIX シェル) の正規組み込みコマンドとして提供されます。

構文
unalias -a unalias AliasName ...

オプション
フラグ
項目 | 説明
-a | 現在のシェル環境から、すべての別名定義を除去します。</pre>
