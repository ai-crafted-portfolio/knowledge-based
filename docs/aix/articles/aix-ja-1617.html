<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ゼロの終了値 (真) を返すか、ゼロ以外の終了値 (偽) を返します。

説明
true
コマンドはゼロの終了値を返します。
false
コマンドはゼロ以外の終了値を返します。 この 2 つのコマンドは、多くの場合シェル・スクリプトの一部として使用します。

構文
TRUE FALSE

例
1 分ごとに一度ずつ日時を表示するループを作成するには、シェル・スクリプトで次のコードを使用します。
while true
do
date
sleep 60
done</pre>
