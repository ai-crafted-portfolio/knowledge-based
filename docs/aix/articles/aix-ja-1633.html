<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
/usr/games ディレクトリー内のファイルの許可コードをオンに設定します。

説明
turnon
コマンドは、
/usr/games
ディレクトリー内のファイルの許可コードを設定します。 このコマンドを実行するには、root ユーザー権限が必要です。
turnon
コマンドは、許可コードを 000 に設定されたファイルを検索し、
許可を 111 に設定します (すべてのユーザー用に実行許可を与えます)。
/usr/games
ディレクトリーに新しいゲームをインストールする場合は、
許可を 111 に設定します。

構文
ターノン (turnon)</pre>
