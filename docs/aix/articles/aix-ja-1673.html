<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
システムが稼働している時間の長さを表示します。

説明
この
uptime
コマンドは、現在の時刻、システムの稼働時間、オンラインユーザー数、および負荷平均を表示します。 ロード平均とは、直前の1分間、5分間、および15分間の間隔において、実行可能状態にあるスレッドのうち、実行中かつCPUを待機しているスレッドの数と、新たに開始されたプロセスからのスレッドの合計数を指します。 コマンド
uptime
の出力は、本質的に、コマンド
w
によって提供される見出し行である。

構文
uptime</pre>
