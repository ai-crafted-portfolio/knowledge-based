<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
端末画面をクリアします。

説明
clear
コマンドは、使用している画面をクリアします (可能な場合)。
clear
コマンドは、最初に、端末タイプについて
TERM
環境変数を検査します。 次に、端末定義ファイルが入っているディレクトリー
/usr/share/lib/terminfo
を検査して、画面を消去する方法を決定します。
TERM
環境変数が設定されていなければ、
clear
コマンドは、なにも処置せず終了します。

構文
clear

例
使用している画面を消去するには、次のように入力します。
clear</pre>
