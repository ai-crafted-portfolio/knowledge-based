<div class="official-dom"><div>
<section><h2>目的</h2> <p>ゼロの終了値 (真) を返すか、ゼロ以外の終了値 (偽) を返します。</p>
</section>

<section><h2>構文</h2> <p><strong>TRUE</strong></p>
 <p><strong>FALSE</strong></p>
</section>

<section><h2>説明</h2> <p><strong>true</strong> コマンドはゼロの終了値を返します。 <strong>false</strong> コマンドはゼロ以外の終了値を返します。 この 2 つのコマンドは、多くの場合シェル・スクリプトの一部として使用します。</p>
</section>

<section><h2>例</h2> <p>1 分ごとに一度ずつ日時を表示するループを作成するには、シェル・スクリプトで次のコードを使用します。</p>
 <div> <div><div><pre><code>while true
do
   date
   sleep 60
done</code></pre></div><div></div></div></div>
</section>

</div></div>
