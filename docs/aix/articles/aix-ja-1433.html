<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
アカウンティングの処理をオフにします。

説明
shutacct
コマンドは、プロセス・アカウンティングをオフにし、
acctwtmp
コマンドを呼び出して
/var/adm/wtmp
ファイルに理由を示すレコードを追加します。
shutacct
コマンドは
shutdown
コマンドによって呼び出されます。
“
注:
/var/adm/wtmp
ファイル内の
Reason
値は引用符で囲む必要があります。
”

構文
/usr/sbin/acct/shutacct [ &quot; 理由 &quot; ]</pre>
