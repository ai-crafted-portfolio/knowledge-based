<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ログイン名を表示します。

説明
logname
コマンドは現在のプロセスのログイン名を表示します。 この名前は、ユーザーがログイン時に使った名前と同じで、システム状態環境内の
LOGNAME
変数に対応します。 この変数は、ユーザーがシステムにログインする場合にしか設定されません。
logname
コマンドは、ログイン名についての情報を取得するために、
getlogin
サブルーチンを呼び出します。

構文
ログ名

例
ログイン名を標準出力に表示するには、次のように入力します。
logname</pre>
