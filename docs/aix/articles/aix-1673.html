<div class="official-dom"><div><section><h2>目的</h2> <p>システムが稼働している時間の長さを表示します。</p>
</section>
<section><h2>構文</h2>
<div><div><pre><code>uptime</code></pre></div><div></div></div></section>

<section><h2>説明</h2>

<p>この <span>uptime</span> コマンドは、現在の時刻、システムの稼働時間、オンラインユーザー数、および負荷平均を表示します。 ロード平均とは、直前の1分間、5分間、および15分間の間隔において、実行可能状態にあるスレッドのうち、実行中かつCPUを待機しているスレッドの数と、新たに開始されたプロセスからのスレッドの合計数を指します。 コマンド <span>uptime</span> の出力は、本質的に、コマンド <a href="https://www.ibm.com/docs/ja/ssw_aix_73/w_commands/w.html" target="_blank" rel="noopener noreferrer"><span>w</span></a> によって提供される見出し行である。</p>

</section>

</div></div>
