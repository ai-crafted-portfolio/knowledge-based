<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
utmp
レコードを標準出力に書き出すことによって、接続時間アカウンティング・レコードを操作します。

説明
acctwtmp
コマンドは、
runacct
コマンドにより呼び出され、
utmp
レコードを標準出力に書き出します。 標準出力には、現在の日付と時刻のほかに、ユーザーが 11 文字以下で指定する
Reason
文字列が含まれています。

構文
acctwtmp &quot;Reason&quot;

オプション
フラグ
ありません。</pre>
