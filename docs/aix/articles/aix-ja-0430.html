<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
tar 形式でアーカイブされた個々のセキュリティー暫定修正をインストールします。

説明
emgr_sec_patch
コマンドは、.tar ファイルを抽出し、現在のオペレーティング・システム・レベルに適用可能な暫定修正を識別し、個々のセキュリティー暫定修正をインストールします。

構文
emgr_sec_patch ifix_tar_file

例
暫定修正 tar ファイルを抽出し、現行のオペレーティング・システム・レベルを識別して、暫定修正をインストールするには、次のコマンドを入力します。
emgr_sec_patch /tmp/games/games_ifix.tar</pre>
