<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
ワークロード区画 (WPAR) に固有のエラー・メッセージを表示します。

説明
wparprnterr
コマンドは、
wparerr
コマンド、
wpar_log_err
サブルーチン、および
kwpar_err
サブルーチンを使用して、WPAR 用にログに記録されたすべてのエラー・メッセージを標準出力上に出力します。

構文
グローバル wparprnterr WparName

例
WPAR
mywpar
のメッセージを表示するには、次のように入力します。
wparprnterr mywpar</pre>
