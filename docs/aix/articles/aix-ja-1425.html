<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
システムの最小および最大機密ラベルを設定します。

説明
setsyslab
コマンドは、システムの最小機密ラベル (SL)、最大 SL、最小保全性ラベル (TL)、および最大 TL を設定します。 SL および TL の値は、
/etc/security/enc/LabelEncodings
ラベル・エンコード・ファイルから取り出されます。

構文
setsyslab

例
システム・ラベルを設定するには、以下のコマンドを入力します。
setsyslab</pre>
