<section><h2>目的</h2> <p>構成アシスト・ウィザードを表示します。</p>
</section>

<section><h2>構文</h2> <p><strong>/usr/cfgassist/bin/configassist</strong></p>
</section>

<section><h2>説明</h2> <p>構成アシスト・ウィザードは、オペレーティング・システムのインストール後自動的に表示され、
構成タスクの支援に使用されます。 また、いつでも任意の時点にこのウィザードを実行して、
追加の構成を完了することができます。</p>
 <div><div>
        <div>
          <div><span>注:</span> このコマンドの絶対パス名 <strong>/usr/cfgassist/bin/configassist</strong>を指定する必要があります。</div>
        </div>
      </div></div>
</section>

<section><h2>フラグ</h2> <p>なし</p>
</section>

<section><h2>例</h2> <p>該当なし</p>
</section>

</div></div>
