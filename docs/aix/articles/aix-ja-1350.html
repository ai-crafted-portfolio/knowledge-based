<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
既存のユーザー指定インストール・ロケーション (USIL) インスタンスを除去します。

説明
rmusil
コマンドは既存の USIL インスタンスを除去します。

構文
rmusil -R RelocatePath -r

オプション
フラグ
項目 | 説明
-r | USIL インスタンスのソフトウェア重要プロダクト・データ (SWVPD) を除去します。
-R RelocatePath | 既存の USIL ロケーションへのパス。
注:
rmusil
コマンドは、SWVPD 内の USIL 参照のみを除去します。 USIL インストール・パスのファイルは除去されません。</pre>
