<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
新規ユーザー向けの情報を提供します。

説明
help
コマンドは、新規ユーザー向けの情報を 1 ページ表示します。 次のトピックに関する情報が使用可能です。
ファイルの連結または表示。
行を対話式に編集する。
メールの送受信。
システム・メッセージの読み取り。
パスワード・ファイル情報を変更しています。
システムの現行ユーザーの識別。
システム上の他のユーザーにメッセージを送信する。
ディレクトリーの内容の表示
ソース・コード制御システムに関する情報の表示。
端末モードの設定。

構文
help

例
ヘルプ情報を入手するには、コマンド・ラインに
help
と入力します。</pre>
