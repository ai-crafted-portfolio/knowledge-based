<!doctype html><meta charset="utf-8"><pre class="official-markdown">目的
Subserver Type オブジェクト・クラスからサブサーバー定義を除去します。

説明
rmserver
コマンドは、Subserver Type オブジェクト・クラスから既存のサブサーバー定義を除去します。

構文
rmserver -t タイプ

オプション
フラグ
項目 | 説明
-t タイプ | 除去する既存のサブサーバーを特定に識別するサブサーバー名を指定します。 サブサーバー・タイプ・オブジェクト・クラスで Type 名が認識されない場合、 rmserver コマンドは失敗します。</pre>
