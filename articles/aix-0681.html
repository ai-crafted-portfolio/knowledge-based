<section><h2>目的</h2> <p>ユーザー・プロセスと <strong>keyserv</strong> デーモンの仲介として機能します。</p>
</section>

<section><h2>構文</h2> <p><strong>/usr/sbin/keyenvoy</strong></p>
</section>

<section><h2>説明</h2> <p><strong>keyenvoy</strong> コマンドは、リモート・プロシージャー・コール (RPC) プログラムによって、ユーザー・プロセスと <strong>keyserv</strong> デーモンの間で仲介として機能します。 <strong>keyserv</strong> デーモンはルート・プロセスとしか通信しないので、仲介が必要となります。 このプログラムは対話式で実行できません。</p>
</section>
