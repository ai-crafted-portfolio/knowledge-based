<section><h2>目的</h2> <p><a href="https://www.ibm.com/docs/ja/ssw_aix_73/r_commands/rusers.html#rusers" target="_blank" rel="noopener noreferrer"><strong>rusers</strong></a> コマンドからの照会に応答します。</p>
</section>

<section><h2>構文</h2> <p><span>/usr/lib/netsvc/rusers/rpc.rusersd</span></p>
</section>

<section><h2>説明</h2> <p><strong>rusersd</strong> デーモンは、ネットワーク上のユーザーの現行リストを戻すことによって、<strong>rusers</strong> コマンドからの照会に応答するサーバーです。 通常、このデーモンは、<strong>inetd</strong> デーモンによって始動されます。</p>
</section>
