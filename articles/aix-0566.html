<div class="official-dom"><div>
<section><h2>目的</h2> <p>システムが稼働しているモードを表示します。</p>
</section>

<section><h2>構文</h2> <p><strong>getrunmode</strong></p>
</section>

<section><h2>説明</h2> <p><strong>getrunmode</strong> コマンドは、システムが稼働しているモードを表示します。 実行モードは、CONFIGURATION モードか OPERATIONAL モードのいずれかです。</p>
</section>

<section><h2>例</h2> <p>稼働モードを取得するには、次のように入力します。</p>
 <div><div><pre><code>getrunmode
</code></pre></div><div></div></div></section>

<section><h2>ファイル</h2> 
<div><div><table><thead> <tr> <th><div>項目</div></th>
 <th><div>説明</div></th>
 </tr>
 </thead>
<tbody>
<tr>
<td><strong>/usr/sbin/getrunmode </strong></td>

<td><strong>getrunmode</strong> コマンドが入っています。</td>

</tr>

</tbody>
</table></div>
</div>
</section>

</div></div>
