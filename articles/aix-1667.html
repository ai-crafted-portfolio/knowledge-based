<section><h2>目的</h2> <p>スーパー・ブロックを定期的に更新します。</p>
</section>

<section><h2>構文</h2> <p><strong>update</strong></p>
</section>

<section><h2>説明</h2> <p><strong>update</strong> コマンドは、
30 秒ごとに <strong>sync</strong> サブルーチンを実行します。 これを行うことで、システムのクラッシュ時でもファイルシステムが最新の状態にあることが保証されます。</p>
</section>
