<div class="official-dom"><div>
<section><h2>目的</h2>

<p>デジタル署名を検証し、暫定修正をインストールします。</p>

</section>

<section><h2>構文</h2>

<div>
<div><div><pre><code>emgr_sec ifix_name.Z</code></pre></div><div></div></div>
</div>

</section>

<section><h2>説明</h2>

<p><span>emgr_sec</span> コマンドは、暫定修正をインストールする前に、セキュリティー暫定修正のデジタル署名を検証します。</p>

</section>

<section><h2>例</h2>

<ol>
<li>暫定修正のデジタル署名を検証し、セキュリティー暫定修正をインストールするには、次のコマンドを入力します。<div>
<div><div><pre><code>emgr_sec /tmp/games/games.211215.epkg.Z</code></pre></div><div></div></div>
</div>
</li>

</ol>

</section>

</div></div>
